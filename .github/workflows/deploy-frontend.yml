name: Deploy DvBakes Frontend → GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'vite-project/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Vite App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vite-project

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vite-project/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build:prod
        env:
          # Render backend URL
          VITE_API_URL: https://dvbakes-backend.onrender.com
          # GitHub Pages base path (must match repo name)
          VITE_BASE_URL: /bakery-slider/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: vite-project/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
